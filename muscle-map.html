<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Muscle Map — FitForge</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark: #0a0a0f;
      --bg-card: rgba(255,255,255,0.04);
      --bg-card-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --border-active: rgba(255,255,255,0.18);
      --text-primary: #f0f0f5;
      --text-secondary: #a0a0b8;
      --text-tertiary: #606078;
      --accent: #6366f1;
      --accent-glow: rgba(99,102,241,0.25);
      --muscle-idle: #2a2a3a;
      --muscle-hover: #3d3d55;
      --muscle-selected: url(#selectedGradient);
      --shadow-lg: 0 24px 48px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ambient background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 600px; height: 600px;
      background: radial-gradient(circle, #6366f1, transparent 70%);
      top: -120px; left: -100px;
    }
    body::after {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #f97316, transparent 70%);
      bottom: -80px; right: -80px;
    }

    .app { position: relative; z-index: 1; }

    /* Header */
    header {
      text-align: center;
      padding: 48px 24px 12px;
    }
    header h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #f0f0f5 0%, #a0a0b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      color: var(--text-tertiary);
      font-size: 14px;
      font-weight: 500;
      margin-top: 8px;
    }

    /* Selection counter pill */
    .counter-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      padding: 6px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }
    .counter-pill .count {
      color: var(--accent);
      font-size: 14px;
      min-width: 18px;
      text-align: center;
    }
    .counter-pill.has-selection {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* Main layout */
    .main-content {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 32px;
      padding: 24px 24px 48px;
      flex-wrap: wrap;
    }

    /* SVG containers */
    .map-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .map-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 24px 20px;
      backdrop-filter: blur(16px);
      transition: all 0.3s ease;
      cursor: default;
    }
    .map-wrapper:hover {
      border-color: var(--border-active);
      background: var(--bg-card-hover);
    }
    .map-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-tertiary);
    }

    /* SVG muscle styling */
    svg path[data-muscle-name] {
      fill: var(--muscle-idle);
      stroke: rgba(255,255,255,0.06);
      stroke-width: 0.5;
      transition: fill 0.2s ease, stroke 0.2s ease, filter 0.2s ease;
      cursor: pointer;
    }
    svg path[data-muscle-name]:hover {
      fill: var(--muscle-hover);
      stroke: rgba(255,255,255,0.15);
      filter: brightness(1.3);
    }
    svg path[data-muscle-name].selected {
      fill: url(#selectedGradient);
      stroke: rgba(99,102,241,0.5);
      stroke-width: 0.8;
      filter: drop-shadow(0 0 6px rgba(99,102,241,0.35));
    }
    svg path[data-muscle-name].selected:hover {
      filter: drop-shadow(0 0 10px rgba(99,102,241,0.5)) brightness(1.15);
    }

    /* Info Panel */
    .info-panel {
      width: 320px;
      position: sticky;
      top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(16px);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 32px 16px;
    }
    .empty-state .icon {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(249,115,22,0.1));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      font-size: 24px;
    }
    .empty-state h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .empty-state p {
      font-size: 13px;
      color: var(--text-tertiary);
      line-height: 1.5;
    }

    /* Muscle detail card */
    .muscle-detail {
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .muscle-detail .muscle-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .muscle-detail .muscle-name {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.25;
    }
    .muscle-detail .muscle-common {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin-top: 2px;
    }
    .muscle-detail .remove-btn {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
      font-size: 14px;
    }
    .muscle-detail .remove-btn:hover {
      background: rgba(239,68,68,0.15);
      border-color: rgba(239,68,68,0.3);
      color: #ef4444;
    }

    .detail-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }
    .detail-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
    }
    .detail-value {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    /* Exercise tags */
    .exercise-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .exercise-tag {
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.15);
      font-size: 11px;
      font-weight: 600;
      color: #818cf8;
      white-space: nowrap;
    }

    /* Selected list */
    .selected-list-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-tertiary);
      margin-bottom: 10px;
    }
    .selected-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 10px;
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.18);
      font-size: 12px;
      font-weight: 600;
      color: #c7d2fe;
      margin: 0 6px 6px 0;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .selected-chip:hover {
      background: rgba(239,68,68,0.12);
      border-color: rgba(239,68,68,0.25);
      color: #fca5a5;
    }
    .selected-chip .chip-x {
      font-size: 10px;
      opacity: 0.5;
    }

    /* Clear all btn */
    .clear-btn {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(239,68,68,0.2);
      background: rgba(239,68,68,0.08);
      color: #f87171;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
    }
    .clear-btn:hover {
      background: rgba(239,68,68,0.15);
      border-color: rgba(239,68,68,0.35);
    }

    /* Tooltip */
    .tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      padding: 6px 12px;
      background: rgba(15,15,25,0.92);
      border: 1px solid var(--border-active);
      border-radius: 10px;
      backdrop-filter: blur(12px);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      opacity: 0;
      transition: opacity 0.15s ease;
      white-space: nowrap;
    }
    .tooltip.visible { opacity: 1; }
    .tooltip .tooltip-sub {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-tertiary);
      margin-top: 1px;
    }

    /* Responsive */
    @media (max-width: 960px) {
      .main-content { flex-direction: column; align-items: center; }
      .info-panel { width: 100%; max-width: 440px; position: static; }
      .maps-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    }
    @media (max-width: 480px) {
      header h1 { font-size: 24px; }
      .map-wrapper { padding: 16px; border-radius: 18px; }
      .map-wrapper svg { width: 140px; height: auto; }
      .info-panel { max-width: 100%; }
    }
  </style>
</head>

            <h3>Select a muscle</h3>
            <p>Tap on any muscle group to see its details, function, and recommended exercises.</p>
          </div>
          <div id="muscleDetail" style="display:none;"></div>
        </div>
        <div class="panel-card" id="selectedPanel" style="display:none;">
          <div class="selected-list-title">Selected muscles</div>

  <!-- Hover Tooltip -->
  <div class="tooltip" id="tooltip">
    <div class="tooltip-name"></div>
    <div class="tooltip-sub"></div>
  </div>

  <script>
    const selected = new Set();
    let lastDetailName = null;

    const tooltip = document.getElementById('tooltip');
    const detailCard = document.getElementById('detailCard');
    const emptyState = document.getElementById('emptyState');
    const muscleDetail = document.getElementById('muscleDetail');
    const selectedPanel = document.getElementById('selectedPanel');
    const selectedChips = document.getElementById('selectedChips');
    const counterPill = document.getElementById('counterPill');
    const selectionCount = document.getElementById('selectionCount');
    const clearAllBtn = document.getElementById('clearAllBtn');

    // Get all interactive muscle paths
    const allPaths = document.querySelectorAll('path[data-muscle-name]');

    // Hover tooltip
    allPaths.forEach(path => {
      path.addEventListener('mouseenter', (e) => {
        const name = path.dataset.muscleName;
        const common = path.dataset.muscleCommon;
        tooltip.querySelector('.tooltip-name').textContent = name;
        tooltip.querySelector('.tooltip-sub').textContent = common;
        tooltip.classList.add('visible');
      });

      path.addEventListener('mousemove', (e) => {
        tooltip.style.left = e.clientX + 14 + 'px';
        tooltip.style.top = e.clientY - 10 + 'px';
      });

      path.addEventListener('mouseleave', () => {
        tooltip.classList.remove('visible');
      });

      // Click to select/deselect
      path.addEventListener('click', () => {
        const name = path.dataset.muscleName;

        if (selected.has(name)) {
          selected.delete(name);
        } else {
          selected.add(name);
        }

        updateSelectionVisuals();
        showDetail(path);
      });
    });

    function updateSelectionVisuals() {
      // Update all paths
      allPaths.forEach(p => {
        const name = p.dataset.muscleName;
        if (selected.has(name)) {
          p.classList.add('selected');
          // For back SVG, use its own gradient
          const isBack = p.closest('#backMap');
          if (isBack) {
            p.style.fill = 'url(#selectedGradientBack)';
          } else {
            p.style.fill = 'url(#selectedGradient)';
          }
        } else {
          p.classList.remove('selected');
          p.style.fill = '';
        }
      });

      // Update counter
      selectionCount.textContent = selected.size;
      counterPill.classList.toggle('has-selection', selected.size > 0);

      // Update selected chips
      if (selected.size > 0) {
        selectedPanel.style.display = '';
        selectedChips.innerHTML = '';
        selected.forEach(name => {
          const chip = document.createElement('span');
          chip.className = 'selected-chip';
          chip.innerHTML = `${name} <span class="chip-x">✕</span>`;
          chip.addEventListener('click', () => {
            selected.delete(name);
            updateSelectionVisuals();
            if (lastDetailName === name) {
              emptyState.style.display = '';
              muscleDetail.style.display = 'none';
              lastDetailName = null;
            }
          });
          selectedChips.appendChild(chip);
        });
      } else {
        selectedPanel.style.display = 'none';
      }
    }

    function showDetail(path) {
      const name = path.dataset.muscleName;
      const common = path.dataset.muscleCommon;
      const fn = path.dataset.muscleFunction;
      const region = path.dataset.muscleRegion;
      const exercises = path.dataset.muscleExercises;
      lastDetailName = name;

      const exerciseTags = exercises.split(',').map(e => e.trim()).filter(Boolean)
        .map(e => `<span class="exercise-tag">${e}</span>`).join('');

      muscleDetail.innerHTML = `
        <div class="muscle-detail">
          <div class="muscle-header">
            <div>
              <div class="muscle-name">${name}</div>
              <div class="muscle-common">${common}</div>
            </div>
            <button class="remove-btn" title="Deselect" onclick="deselectMuscle('${name}')">✕</button>
          </div>
          <div class="detail-row">
            <span class="detail-label">Region</span>
            <span class="detail-value">${region.charAt(0).toUpperCase() + region.slice(1)}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Function</span>
            <span class="detail-value">${fn}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Exercises</span>
            <div class="exercise-tags">${exerciseTags}</div>
          </div>
        </div>
      `;

      emptyState.style.display = 'none';
      muscleDetail.style.display = '';
    }

    window.deselectMuscle = function(name) {
      selected.delete(name);
      updateSelectionVisuals();
      emptyState.style.display = '';
      muscleDetail.style.display = 'none';
      lastDetailName = null;
    };

    clearAllBtn.addEventListener('click', () => {
      selected.clear();
      updateSelectionVisuals();
      emptyState.style.display = '';
      muscleDetail.style.display = 'none';
      lastDetailName = null;
    });
  </script>
